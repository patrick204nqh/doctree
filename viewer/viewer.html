<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctree</title>
  <link rel="icon" href="../icons/icon48.png">
  <link rel="stylesheet" href="viewer.css">
  <script src="theme.js"></script>
</head>
<body>
  <div id="toolbar">
    <div id="toolbar-left">
      <button id="tree-toggle" class="btn icon-btn" aria-label="Toggle file tree" aria-controls="sidebar" aria-expanded="true" title="Toggle file tree (\)" hidden>
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.2"/>
          <path d="M6 2.5v11" fill="none" stroke="currentColor" stroke-width="1.2"/>
        </svg>
      </button>
      <span id="brand">
        <svg viewBox="8 2 40 58" width="14" height="20" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round">
            <circle cx="28" cy="40" r="14"/>
            <path d="M42 8V54M42 15H26"/>
          </g>
          <circle cx="19" cy="15" r="5.5" fill="var(--link)"/>
        </svg>
        doctree
      </span>
      <div class="btn-group">
        <button id="open-folder-btn" class="btn" title="Pick the folder to read">Open Folder</button>
        <button id="folders-btn" class="btn caret" popovertarget="folders-menu" aria-haspopup="menu" aria-expanded="false" aria-label="Recent folders" title="Recent folders">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <span id="file-name"></span>
      <nav id="crumbs" aria-label="Path" hidden></nav>
      <span id="file-meta" hidden></span>
    </div>
    <div id="toolbar-right">
      <div id="mode-switch" class="seg" role="group" aria-label="View" hidden>
        <button id="mode-preview" class="seg-btn" type="button" aria-pressed="true" title="Preview (r)">Preview</button>
        <button id="mode-raw" class="seg-btn" type="button" aria-pressed="false" title="Raw text (r)">Raw</button>
      </div>
      <div id="copy-group" class="btn-group" hidden>
        <button id="copy-content-btn" class="btn" title="Copy the file's text">Copy</button>
        <button id="copy-menu-btn" class="btn caret" popovertarget="copy-menu" aria-haspopup="menu" aria-expanded="false" aria-label="More ways to copy" title="Copy the path or the text">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <button id="quick-btn" class="btn" title="Jump to any file" hidden>Quick open <kbd></kbd></button>
      <button id="settings-btn" class="btn icon-btn" popovertarget="settings-menu" aria-haspopup="dialog" aria-expanded="false" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <path d="M2 4.5h7M12.5 4.5H14M2 11.5h1.5M7 11.5h7" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          <circle cx="10.75" cy="4.5" r="1.75" fill="none" stroke="currentColor" stroke-width="1.2"/>
          <circle cx="5.25" cy="11.5" r="1.75" fill="none" stroke="currentColor" stroke-width="1.2"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="main">
    <nav id="sidebar" hidden>
      <div id="filter-box"><input id="filter" type="search" placeholder="Filter files" autocomplete="off"></div>
      <div id="tree"></div>
    </nav>
    <div id="resize-handle" hidden></div>
    <div id="content-wrapper">
      <div id="content">
        <div id="markdown-body"></div>
      </div>
    </div>
    <nav id="toc" aria-label="Outline" hidden></nav>
  </div>

  <div id="folders-menu" class="menu" popover role="menu" aria-label="Recent folders"></div>
  <div id="copy-menu" class="menu" popover role="menu" aria-label="Copy"></div>
  <div id="crumb-menu" class="menu crumb-menu" popover="manual" role="menu" aria-label="Folder contents"></div>
  <div id="settings-menu" class="menu" popover role="dialog" aria-label="Settings">
    <div class="s-row" role="group" aria-labelledby="s-theme">
      <span id="s-theme">Theme</span>
      <span class="seg"><button type="button" data-pref="theme" data-value="light">Light</button><button type="button" data-pref="theme" data-value="dark">Dark</button></span>
    </div>
    <div class="s-row" role="group" aria-labelledby="s-width">
      <span id="s-width">Reading width <kbd>w</kbd></span>
      <span class="seg"><button type="button" data-pref="width" data-value="full">Full</button><button type="button" data-pref="width" data-value="contained">Contained</button></span>
    </div>
    <div class="s-row" role="group" aria-labelledby="s-crumbs">
      <span id="s-crumbs">Breadcrumb</span>
      <span class="seg"><button type="button" data-pref="crumbs" data-value="on">On</button><button type="button" data-pref="crumbs" data-value="off">Off</button></span>
    </div>
    <div class="s-row" role="group" aria-labelledby="s-outline">
      <span id="s-outline">Outline <kbd>o</kbd></span>
      <span class="seg"><button type="button" data-pref="outline" data-value="on">On</button><button type="button" data-pref="outline" data-value="off">Off</button></span>
    </div>
    <div class="s-row" role="group" aria-labelledby="s-tree">
      <span id="s-tree">File tree <kbd>\</kbd></span>
      <span class="seg"><button type="button" data-pref="tree" data-value="on">On</button><button type="button" data-pref="tree" data-value="off">Off</button></span>
    </div>
  </div>

  <dialog id="palette" aria-label="Quick open">
    <input id="palette-input" type="text" placeholder="Jump to a file" autocomplete="off" spellcheck="false"
           role="combobox" aria-expanded="true" aria-controls="palette-list" aria-autocomplete="list">
    <ul id="palette-list" role="listbox"></ul>
  </dialog>

  <script src="../libs/marked.min.js"></script>
  <script src="../libs/purify.min.js"></script>
  <script src="../libs/highlight.min.js"></script>
  <script src="../libs/mermaid.min.js"></script>
  <script type="module" src="viewer.js"></script>
</body>
</html>
